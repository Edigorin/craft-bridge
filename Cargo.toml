[package]
name = "craft-bridge"
version = "0.1.0"
edition = "2021"
description = "Pack SolidCraft designs into craftx artifacts and inspect them"
license = "Apache-2.0"
repository = "https://github.com/Edigorin/craft-bridge"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
